[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "mstr-tableau-migrator"
version = "0.1.0"
description = "MicroStrategy → Tableau automated migration platform"
requires-python = ">=3.11"
dependencies = [
    # Web Framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",

    # Database
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",

    # Settings & Validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # HTTP Client (MSTR REST API)
    "httpx>=0.27.0",

    # Graph Analysis
    "networkx>=3.3",

    # LLM
    "openai>=1.30.0",

    # Tableau Tools
    "tableauhyperapi>=0.0.19691",
    "tableauserverclient>=0.30",

    # XML Processing
    "lxml>=5.2.0",

    # SQL Parsing & Validation
    "sqlglot>=23.0.0",

    # Data Processing
    "pandas>=2.2.0",

    # Utilities
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
